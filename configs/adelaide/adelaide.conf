<VirtualHost *:80>
    ServerAdmin admin@adelaide.local
    ServerName adelaide.local

    DocumentRoot /var/www/adelaide

    ErrorLog ${APACHE_LOG_DIR}/adelaide_error.log
    CustomLog ${APACHE_LOG_DIR}/adelaide_access.log combined

    <Directory /var/www/adelaide>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
