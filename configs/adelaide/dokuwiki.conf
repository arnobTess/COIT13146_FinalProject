<VirtualHost *:80>

    ServerName dokuwiki.local

    DocumentRoot /var/www/dokuwiki

    <Directory /var/www/dokuwiki>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dokuwiki_error.log
    CustomLog ${APACHE_LOG_DIR}/dokuwiki_access.log combined

</VirtualHost>
