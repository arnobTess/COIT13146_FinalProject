<VirtualHost *:443>

    ServerName adelaide.local

    DocumentRoot /var/www/adelaide

    SSLEngine on

    SSLCertificateFile /etc/ssl/certs/adelaide.crt
    SSLCertificateKeyFile /etc/ssl/private/adelaide.key

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

</VirtualHost>
